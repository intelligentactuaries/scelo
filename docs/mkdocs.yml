site_name: Scelo IDE
site_description: The actuarial workbench — soft data → models → hard results, with a bundled Python + R runtime and AI co-pilots scoped to each stage.
site_url: https://docs.intelligentactuaries.com/scelo/
# Rendered as HTML in the footer of every page. Carries the way back up to
# the hub, since this sub-site is one of several on the domain.
copyright: >-
  Copyright © 2026 Intelligent Actuaries ·
  <a href="https://docs.intelligentactuaries.com/">All documentation</a>

extra_css:
  - stylesheets/extra.css
  - stylesheets/scelo-demos.css

extra_javascript:
  - assets/js/scelo-demos.js

theme:
  name: material
  language: en
  # overrides/main.html only adds a <head> script: the one-time palette
  # reset, which has to run before Material's bundle reads localStorage.
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  # Neither entry carries a `media:` key, which is deliberate: Material
  # then selects the first palette for a fresh visitor rather than
  # following the OS, so everyone starts on the cream default. The toggle
  # still works and Material persists the choice per sub-site path. Do not
  # add `media:` here without meaning to hand the default back to the OS.
  palette:
    # Light (default) — IA warm cream
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark — IA warm charcoal
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Drop the "Made with Material for MkDocs" line from the footer. This is
  # the theme's own supported setting, and mkdocs-material is MIT, so the
  # notice is a courtesy rather than a licence condition. The copyright
  # headers inside the bundled assets are untouched, which is what the
  # licence does ask for. The footer keeps our own copyright and the link
  # back to the hub.
  generator: false
  # Points the masthead at the hub rather than at this sub-site's own
  # index, so the logo reads as "up a level", the way it does on any
  # portal. The sub-site's front page stays one click away on Home.
  homepage: https://docs.intelligentactuaries.com/

plugins:
  - search

nav:
  - Home: index.md
  - Installation:
      - installation/index.md
      - Linux: installation/linux.md
      - Windows & macOS: installation/windows-macos.md
      - First launch: installation/first-launch.md
  - Getting started: getting-started.md
  - The workspace:
      - workspace/index.md
      - Editor & files: workspace/editor.md
      - Terminal & runtimes: workspace/terminal.md
      - Search, Git, Problems, Tests: workspace/panels.md
      - Command palette: workspace/command-palette.md
  - The pipeline:
      - pipeline/index.md
      - Soft Data: pipeline/soft-data.md
      - Tools (models): pipeline/tools.md
      - Hard Data: pipeline/hard-data.md
  - The swarm:
      - swarm/index.md
      - Running it: swarm/running.md
      - Council, society & simulation: swarm/views.md
  - Python & R libraries:
      - libraries/index.md
      - Python (scelo): libraries/python.md
      - R (scelo): libraries/r.md
  - AI providers: ai-providers.md
  - Chat: chat.md
  - Exporting: exporting.md
  - Reference:
      - reference/shortcuts.md
      - reference/file-locations.md
      - reference/troubleshooting.md
  - Build from source: build-from-source.md
