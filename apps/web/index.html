<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-paint theme — mirrors src/lib/theme.ts so the first frame is
      // already painted in the right palette (no FOUC).
      (function () {
        try {
          var v = localStorage.getItem("ia.theme");
          var resolved =
            v === "light" || v === "dark"
              ? v
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.classList.add(resolved);
          if (window.scelo && window.scelo.windowTheme) window.scelo.windowTheme(resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script>
      // Launch intro (see #ia-intro below): desktop IDE only, once per window.
      (function () {
        try {
          if (
            location.protocol === "scelo:" &&
            sessionStorage.getItem("ia.intro.shown") !== "1" &&
            localStorage.getItem("ia.intro") !== "off"
          ) {
            document.documentElement.classList.add("ia-intro-on");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Launch intro — the S₀.₂ mark on the app's own background, painted in
         the window's first frame. Draws from the two apps it studies: Grok's
         mark comes alive as it appears (here a pen traces the S, the ink
         fills in, the version ticks into place); Cursor holds a calm, still
         mark while the app loads, then steps aside and the first screen
         fades in in a short cascade ([data-intro] 1, 2, 3). */
      #ia-intro { display: none; }
      html.ia-intro-on #ia-intro {
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center;
        background: #e8e4d8; color: #181715; --ia-pen: #3c6e5a;
        /* An even curve for the exit: out-quint front-loads the change and
           reads as a cut, where this dissolve should be seen. */
        transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.ia-intro-on[data-theme="dark"] #ia-intro {
        background: #1b1815; color: #faf6ea; --ia-pen: #6eb491;
      }
      #ia-intro svg {
        width: 104px; height: auto; overflow: visible;
        animation: ia-breathe 2800ms ease-in-out 1250ms infinite;
      }
      #ia-intro .ia-trace {
        fill: none; stroke: var(--ia-pen); stroke-width: 1.4px;
        stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000;
        animation:
          ia-draw 640ms cubic-bezier(0.77, 0, 0.175, 1) 40ms forwards,
          ia-out 280ms ease 560ms forwards;
      }
      #ia-intro .ia-ink { opacity: 0; animation: ia-in 380ms cubic-bezier(0.16, 1, 0.3, 1) 420ms forwards; }
      #ia-intro .ia-sub { opacity: 0; transform: translateY(70px); }
      #ia-intro .ia-sub { animation: ia-rise 380ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      #ia-intro .ia-sub.d0 { animation-delay: 560ms; }
      #ia-intro .ia-sub.d1 { animation-delay: 630ms; }
      #ia-intro .ia-sub.d2 { animation-delay: 700ms; }
      #ia-intro.is-leaving { opacity: 0; pointer-events: none; }
      #ia-intro.is-leaving svg {
        animation: ia-leave 300ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      html.ia-intro-reveal [data-intro] {
        animation: ia-reveal 460ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }
      html.ia-intro-reveal [data-intro="2"] { animation-delay: 80ms; }
      html.ia-intro-reveal [data-intro="3"] { animation-delay: 160ms; }
      @keyframes ia-draw { to { stroke-dashoffset: 0; } }
      @keyframes ia-out { to { opacity: 0; } }
      @keyframes ia-in { to { opacity: 1; } }
      @keyframes ia-rise { to { opacity: 1; transform: none; } }
      @keyframes ia-breathe { 50% { transform: scale(1.015); } }
      @keyframes ia-leave { to { opacity: 0; transform: scale(0.97); } }
      @keyframes ia-reveal { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #ia-intro *, html.ia-intro-reveal [data-intro] { animation: none !important; }
        #ia-intro .ia-trace { display: none; }
        #ia-intro .ia-ink, #ia-intro .ia-sub { opacity: 1; transform: none; }
      }
    </style>
    <link rel="icon" type="image/png" href="/logo_dot.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts (Fraunces, Inter, JetBrains Mono, SN Pro) are self-hosted via
         @fontsource imports in src/main.tsx so the app works fully offline
         inside the Scelo IDE desktop shell (no Google Fonts CDN). -->

    <title>Workbench</title>
  </head>

    <script>
      // Hold the intro until the app has painted (main.tsx calls
      // __iaIntroReady) and the mark has finished arriving, then step aside.
      // A click or key skips it; it never stays longer than MAX.
      (function () {
        var el = document.getElementById("ia-intro");
        var html = document.documentElement;
        if (!el) return;
        if (!html.classList.contains("ia-intro-on")) {
          el.remove();
          return;
        }
        try {
          sessionStorage.setItem("ia.intro.shown", "1");
        } catch (e) {}
        var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        var start = performance.now();
        var MIN = reduced ? 350 : 1100;
        var MAX = 6000;
        var ready = false;
        var gone = false;
        function leave() {
          if (gone) return;
          gone = true;
          html.classList.add("ia-intro-reveal");
          el.classList.add("is-leaving");
          setTimeout(function () {
            el.remove();
            html.classList.remove("ia-intro-on");
          }, 460);
          setTimeout(function () {
            html.classList.remove("ia-intro-reveal");
          }, 1000);
        }
        window.__iaIntroReady = function () {
          if (ready) return;
          ready = true;
          var wait = MIN - (performance.now() - start);
          if (wait > 0) setTimeout(leave, wait);
          else leave();
        };
        setTimeout(leave, MAX);
        el.addEventListener("pointerdown", leave);
        addEventListener("keydown", leave, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
